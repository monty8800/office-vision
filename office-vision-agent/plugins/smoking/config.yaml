# Smoking Detector 插件
# 抽烟行为检测：夹烟手势（食指近嘴 + 指尖聚拢）+ 往返运动模式 + 状态机去重

# --- 单帧命中条件（三者须同时满足）---
mouth_region_expand: 1.4     # 嘴部区域外扩倍数（食指指尖 / 手腕须落入其中）
grip_distance_ratio: 0.6     # 拇指-食指指尖距离 < 嘴部尺寸×该比例 视为夹持手势

# --- 会话级确认条件（排除"手一直放嘴上"的静态姿势）---
min_hits_to_start: 8         # 累计命中帧数达标
min_suspect_seconds: 3.0     # 命中持续时长达标（秒）
min_round_trips: 1           # 窗口内"举起→放下"往返次数达标（真实抽烟的重复动作）
round_trip_window_seconds: 15.0  # 往返统计的时间窗口（秒）
lift_fraction: 0.25          # 手腕抬升幅度阈值（相对窗口内最大振幅的比例）

# --- 会话收尾 ---
max_misses_suspect: 8        # Suspect 状态允许的最大连续丢失帧数
no_detection_timeout: 30.0   # Smoking 中超过该秒数无检测则结束（秒）
min_duration: 5.0            # 低于该时长的会话视为误报，丢弃（秒）

# --- 香烟检出强证据（自训练 cigarette 检测模型，加速确认）---
# 近 cigarette_memory_seconds 内检出过香烟时，命中数/时长阈值降为以下宽松值；
# 无检出时维持上方严格条件（往返运动要求不变）
cigarette_min_hits_to_start: 3     # 有香烟证据时的累计命中帧数阈值
cigarette_min_suspect_seconds: 1.0 # 有香烟证据时的持续时长阈值（秒）
cigarette_memory_seconds: 3.0      # 香烟检出后多久内视为有效证据（秒）
cigarette_min_gesture_frames: 1    # 独立通道确认前窗口内至少几帧食指近嘴（防笔/手表/五官误检）

# --- 香烟位置判据（用户规则：烟在手中或嘴里才算抽烟，放桌上不算）---
# 香烟框中心须落入"嘴部外扩区"多少次（滚动窗口内）视为"在嘴里"的强证据（无需手势即确认）
cig_in_mouth_confirm_frames: 2
# 香烟框中心距"近嘴的手"关键点（腕/食指/拇指）的最大距离（相对嘴部尺寸）
cig_in_hand_proximity: 2.0

# --- 行为分类确认通道（smoking-cls，默认关闭）---
# 官方分类模型不可靠（README 记过"smoking 全抬头/normal 全低头"捷径学习），会拉低召回，
# 已被上方"香烟位置判据"取代；classifier_confirm_frames=0 即关闭。
classifier_confirm_frames: 0       # 窗口内分类为 smoking 的最少帧数（0=关闭该通道）
classifier_min_conf: 0.6           # 判定为 smoking 所需的最小分类置信度
