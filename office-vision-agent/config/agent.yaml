# Office Vision Agent 配置
# 所有配置必须来自本文件，禁止硬编码（第四原则）。

agent:
  name: "office-vision-agent"
  device_id: "mac-main"          # 设备标识，Server 用于区分多 Agent
  log_level: "INFO"

camera:
  type: "uvc"                    # uvc | rtsp | rpicam | esp32（硬件抽象，第五原则）
  index: 0
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 10              # 预热帧数（等待自动曝光稳定）

detector:
  type: "yolo"                   # yolo | coreml | tensorrt | openvino | tflite（AI 可替换，第三原则）
  weights: "models/yolo11n.pt"
  confidence: 0.45
  person_only: true              # 人形过滤（不影响香烟第二模型）
  # 自训练香烟检测（yolo-training 项目产出）；权重缺失时自动降级为仅人形检测
  cigarette_weights: "../yolo-training/weights/cigarette-best.pt"
  cigarette_confidence: 0.5      # 香烟小目标，阈值高于人形；0.5 可抑制面/眼镜/笔误检
  # 自训练 smoking 行为分类（YOLO-cls）；作为第三重确认通道抑制香烟误检，缺失则降级
  smoking_cls_weights: "../yolo-training/weights/smoking-cls-best.pt"
  smoking_cls_confidence: 0.6    # 判定为 smoking 的最小分类置信度

pose:
  type: "mediapipe"              # 姿态特征提取器（可替换）
  face_model: "models/face_landmarker.task"
  hand_model: "models/hand_landmarker.task"
  num_hands: 2

pipeline:
  process_fps: 10                # 在岗时的完整管线频率
  sleep_fps: 0.5                 # 休眠时的轻量唤醒探测频率

presence:
  enabled: true
  sleep_after_seconds: 300       # 离岗多久后自动休眠（5分钟）
  resume_wait_seconds: 3         # 恢复等待

server:
  url: "http://localhost:8000"
  push_interval_seconds: 5       # 事件批量上报间隔
  offline_cache: "data/event_cache.db"   # Server 不可用时本地缓存
  heartbeat_interval_seconds: 30 # 心跳间隔（需明显小于 Server 的 60s 在线阈值）

plugins:
  dir: "plugins"                 # 行为检测插件目录

# 日志落盘与上传：增量上报到 Server（POST /api/logs），方便远程排查客户端问题
logging:
  file: "data/logs/agent.log"    # 落盘路径（Loguru 自动轮转）
  rotation: "10 MB"
  retention: 5                   # Loguru 兜底保留数（上传成功即删，正常不会堆积到兜底值）
  upload_enabled: true
  upload_interval_seconds: 300   # 定时上传间隔
  error_trigger: true            # ERROR 级日志立即触发上传
  error_debounce_seconds: 30     # 错误触发防抖（避免错误风暴刷爆上传）
  max_chunk_bytes: 262144        # 单次上传最大 256KB

# 实时监控中心：仅开发模式启用，发布版 enabled=false
monitor:
  enabled: true
  overlay: true                  # 摄像头画面 Overlay（Face/Hand/Mouth/BBox/Distance）
  performance: true              # CPU / Memory / FPS / Inference / Latency
  timeline: true                 # Event 实时流
  replay: true                   # 事件前后各 10s 回放（截图模式，不录视频以节省磁盘）
  replay_before_seconds: 10
  replay_after_seconds: 10
  replay_snapshot_interval: 1    # 回放截图抽帧间隔（秒）
  save_snapshot: true            # 一键截图（图片 + Overlay + 状态）
  frame_buffer_seconds: 30       # 帧环形缓冲时长（供 Replay 取前段）
  port: 8100                     # Agent 内置监控 HTTP 服务端口
  host: 0.0.0.0                  # 监听局域网，供 Windows 训练机跨设备采集帧（默认 127.0.0.1）
  annotate_dir: "data/annotate"  # Monitor 页面「数据集标注」产物（图片+labelme JSON）目录
