# Railway config-as-code（Server 服务，root directory: office-vision-server）
# Railpack 检测到 uv.lock 后自动使用 uv 安装依赖。
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
watchPatterns = ["office-vision-server/**"]

[deploy]
startCommand = "uv run uvicorn server.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
restartPolicyType = "ALWAYS"
