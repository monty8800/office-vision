[project]
name = "office-vision-launcher"
version = "0.1.0"
description = "Office Vision AI 托盘启动器：Agent 端托管与在线升级（macOS/Windows）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "psutil>=6.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.scripts]
office-vision-tray = "launcher.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launcher"]
